openapi: 3.0.0
info:
  title: API de Autenticación Enterprise
  version: 1.0.0
  description: Servicio de autenticación, autorización y gestión de eventos de seguridad.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: Registro de nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                firstName: { type: string }
                middleName: { type: string }
                lastName: { type: string }
                secondLastName: { type: string }
                documentTypeCode:
                  {
                    type: string,
                    description: 'Código DANE del tipo de documento (CC, TI, CE, PAS, ...)',
                  }
                documentNumber: { type: string }
                phone: { type: string }
      responses:
        '201':
          description: Usuario registrado exitosamente
  /auth/login:
    post:
      summary: Inicio de sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Inicio de sesión exitoso
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: string }
  /auth/logout:
    post:
      summary: Cierre de sesión (invalida el refresh token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Sesión cerrada exitosamente
  /auth/me:
    get:
      summary: Perfil del usuario autenticado
      description: >-
        Requiere header Authorization con el accessToken. Es la fuente de verdad
        para la vista de perfil del frontend. Además del usuario, roles y módulos,
        incluye el tercero (persons) y los datos académicos de university-service
        (estudiante con programa o docente con facultad) cuando el usuario fue
        provisionado desde un tercero. Regla del dominio: todo estudiante/docente
        proviene de un tercero con usuario.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  uuid: { type: string }
                  email: { type: string, format: email }
                  roles: { type: array, items: { type: string } }
                  cedula: { type: string, nullable: true }
                  nombre: { type: string, nullable: true }
                  tercero:
                    type: object
                    nullable: true
                    properties:
                      primerNombre: { type: string }
                      segundoNombre: { type: string, nullable: true }
                      primerApellido: { type: string }
                      segundoApellido: { type: string, nullable: true }
                      nombre: { type: string }
                      tipoDocumento: { type: string }
                      numeroDocumento: { type: string }
                      fechaNacimiento: { type: string, format: date, nullable: true }
                      genero: { type: string, nullable: true }
                      email: { type: string }
                      telefono: { type: string, nullable: true }
                      direccion: { type: string, nullable: true }
                      ciudad: { type: string, nullable: true }
                  estudiante:
                    type: object
                    nullable: true
                    properties:
                      codigoEstudiante: { type: string }
                      fechaMatricula: { type: string, format: date }
                      semestreActual: { type: integer }
                      promedio: { type: number, nullable: true }
                      estado: { type: string }
                      programa:
                        type: object
                        properties:
                          id: { type: integer }
                          nombre: { type: string }
                          codigo: { type: string }
                  docente:
                    type: object
                    nullable: true
                    properties:
                      codigoDocente: { type: string }
                      tipoContrato: { type: string }
                      fechaContratacion: { type: string, format: date }
                      tituloAcademico: { type: string, nullable: true }
                      estado: { type: string }
                      facultad:
                        type: object
                        properties:
                          id: { type: integer }
                          nombre: { type: string }
                          codigo: { type: string }
        '401':
          description: Token de acceso no proporcionado, inválido o expirado
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
