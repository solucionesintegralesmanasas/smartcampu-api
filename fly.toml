# Configuración de Fly.io para smartcampu-api (despliegue unificado del monorepo)
app = "smartcampu-api"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    SERVICE_NAME = "all"
    PORT = "3000"
    HEALTH_PATH = "/health"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  CORS_ALLOWED_ORIGINS = "https://smartcampus-sigma.vercel.app,https://smartcampus-sigma-*.vercel.app,https://uajs-smart-campus.vercel.app,https://uajs-smart-campus-*.vercel.app,https://smartcampus.solucionesintegralesmana.com,http://localhost:5173"
  SERVICE_AUTH_URL = "http://127.0.0.1:3001"
  SERVICE_USER_URL = "http://127.0.0.1:3002"
  SERVICE_CATALOG_URL = "http://127.0.0.1:3003"
  SERVICE_UNIVERSITY_URL = "http://127.0.0.1:3004"
  SERVICE_RESOURCE_URL = "http://127.0.0.1:3005"
  SERVICE_BOOKING_URL = "http://127.0.0.1:3006"
  SERVICE_REQUEST_URL = "http://127.0.0.1:3007"
  SERVICE_EVENT_URL = "http://127.0.0.1:3008"
  SERVICE_NOTIFICATION_URL = "http://127.0.0.1:3009"
  SERVICE_PQRS_URL = "http://127.0.0.1:3010"
  SERVICE_STORAGE_URL = "http://127.0.0.1:3011"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
