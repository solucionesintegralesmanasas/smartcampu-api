# Configuración de Fly.io para api-gateway (punto de entrada público)
app = "smartcampu-api"
primary_region = "bog"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    SERVICE_NAME = "api-gateway"
    PORT = "3000"
    HEALTH_PATH = "/health"

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
