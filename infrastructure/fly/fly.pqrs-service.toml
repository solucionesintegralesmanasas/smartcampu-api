# Configuración de Fly.io para pqrs-service
app = "uajs-smartcampus-pqrs-service"
primary_region = "gru"

[build]
  dockerfile = "../../Dockerfile"

  [build.args]
    SERVICE_NAME = "pqrs-service"
    PORT = "3010"
    HEALTH_PATH = "/api/v1/pqrs/health"

[env]
  NODE_ENV = "production"
  PORT = "3010"
  SERVICE_STORAGE_URL = "http://uajs-smartcampus-storage-service.internal:3011"

[http_service]
  internal_port = 3010
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/v1/pqrs/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
