# Configuración de Fly.io para storage-service
app = "uajs-smartcampus-storage-service"
primary_region = "gru"

[build]
  dockerfile = "../../Dockerfile"

  [build.args]
    SERVICE_NAME = "storage-service"
    PORT = "3011"
    HEALTH_PATH = "/api/v1/storage/health"

[env]
  NODE_ENV = "production"
  PORT = "3011"
  STORAGE_PATH = "/uploads"

[http_service]
  internal_port = 3011
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/v1/storage/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
