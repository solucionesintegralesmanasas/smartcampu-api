# Configuración de Fly.io para resource-service
app = "uajs-smartcampus-resource-service"
primary_region = "gru"

[build]
  dockerfile = "../../Dockerfile"

  [build.args]
    SERVICE_NAME = "resource-service"
    PORT = "3005"
    HEALTH_PATH = "/api/v1/resources/health"

[env]
  NODE_ENV = "production"
  PORT = "3005"

[http_service]
  internal_port = 3005
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/v1/resources/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
