      - '3009:3009'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3009/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - uajs-network

  pqrs-service:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.base
    image: uajs-base
    container_name: uajs-pqrs
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../../:/app
      - /app/node_modules
    command: npx nodemon apps/pqrs-service/src/server.js
    environment:
      PORT: 3010
      NODE_ENV: development
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: uajs_pqrs
      MYSQL_USER: ${MYSQL_USER:-uajs_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-uajs206**}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-uajs_dev_jwt_secret_1234567890abcdefghijklmnopqrstuvwxyz_extra_long_654321}
      SERVICE_AUTH_TOKEN: ${SERVICE_AUTH_TOKEN:-uajs_service_token_2024}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: '9200'
      ELASTICSEARCH_USER: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-changeme}
      PQRS_INDEX: uajs_pqrs
      HOLIDAYS: 2026-01-01,2026-05-01,2026-07-20,2026-12-25
    ports:
      - '3010:3010'
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3010/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - uajs-network

# ======================================================
# Volúmenes persistentes
# ======================================================
volumes:
  mysql_data:
  redis_data:
  es-data:
    driver: local

# ======================================================
# Red interna
# ======================================================
networks:
  uajs-network:
    driver: bridge
