apiVersion: apps/v1
kind: Deployment
metadata:
  name: pqrs-service
  namespace: uajs-smart-campus
spec:
  replicas: 2
  selector:
    matchLabels: { app: pqrs-service }
  template:
    metadata:
      labels: { app: pqrs-service }
    spec:
      containers:
        - name: pqrs-service
          image: uajs-base:latest
          command: ['node', 'apps/pqrs-service/src/server.js']
          ports:
            - containerPort: 3010
          envFrom:
            - configMapRef: { name: uajs-shared-config }
          env:
            - name: PORT
              value: '3010'
            - name: MYSQL_DATABASE
              value: 'uajs_pqrs'
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: MYSQL_PASSWORD } }
            - name: SERVICE_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: SERVICE_AUTH_TOKEN } }
          readinessProbe:
            httpGet: { path: /api/v1/pqrs/health, port: 3010 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/pqrs/health, port: 3010 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: pqrs-service
  namespace: uajs-smart-campus
spec:
  selector: { app: pqrs-service }
  ports:
    - port: 3010
      targetPort: 3010
