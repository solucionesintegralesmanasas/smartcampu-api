apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: uajs-smart-campus
spec:
  replicas: 2
  selector:
    matchLabels: { app: auth-service }
  template:
    metadata:
      labels: { app: auth-service }
    spec:
      containers:
        - name: auth-service
          image: uajs-base:latest
          command: ['node', 'apps/auth-service/src/server.js']
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef: { name: uajs-shared-config }
          env:
            - name: PORT
              value: '3001'
            - name: MYSQL_DATABASE
              value: 'uajs_auth'
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: MYSQL_PASSWORD } }
            - name: SERVICE_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: SERVICE_AUTH_TOKEN } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: JWT_SECRET } }
            - name: JWT_REFRESH_SECRET
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: JWT_REFRESH_SECRET } }
            - name: SMTP_HOST
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: SMTP_HOST } }
            - name: SMTP_PORT
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: SMTP_PORT } }
            - name: SMTP_USER
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: SMTP_USER } }
            - name: SMTP_PASS
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: SMTP_PASS } }
          readinessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: uajs-smart-campus
spec:
  selector: { app: auth-service }
  ports:
    - port: 3001
      targetPort: 3001
