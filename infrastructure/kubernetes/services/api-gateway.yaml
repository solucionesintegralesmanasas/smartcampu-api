apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: uajs-smart-campus
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          # Reemplazar por la ruta real del registro (ver infrastructure/docker/Dockerfile.base).
          image: uajs-base:latest
          command: ['node', 'apps/api-gateway/src/server.js']
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: uajs-shared-config }
          env:
            - name: PORT
              value: '3000'
            - name: SERVICE_AUTH_TOKEN
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: SERVICE_AUTH_TOKEN } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: uajs-shared-secrets, key: JWT_SECRET } }
          readinessProbe:
            httpGet: { path: /health/liveness, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health/liveness, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: uajs-smart-campus
spec:
  selector: { app: api-gateway }
  ports:
    - port: 3000
      targetPort: 3000
