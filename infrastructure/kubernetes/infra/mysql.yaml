apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: uajs-smart-campus
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 10Gi
---
# Las migraciones (scripts/migrations/ms-*_001_init.sql) se cargan como un
# ConfigMap y se montan en /docker-entrypoint-initdb.d, igual que hace
# infrastructure/docker/init/init-databases.sh vía volumen en docker-compose.
# Generar con:
#   kubectl create configmap mysql-migrations \
#     --from-file=../../../scripts/migrations \
#     -n uajs-smart-campus --dry-run=client -o yaml > infra/mysql-migrations-configmap.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: uajs-smart-campus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: uajs-shared-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DATABASE
              value: 'uajs_smart_campus'
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef: { name: uajs-shared-config, key: MYSQL_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: uajs-shared-secrets, key: MYSQL_PASSWORD }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: migrations
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ['mysqladmin', 'ping', '-h', 'localhost']
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ['mysqladmin', 'ping', '-h', 'localhost']
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
        - name: migrations
          configMap:
            name: mysql-migrations
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: uajs-smart-campus
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
